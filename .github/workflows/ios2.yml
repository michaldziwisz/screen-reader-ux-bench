name: Pomiar 2 iOS drzewo
on: workflow_dispatch
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  measure:
    runs-on: macos-15
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - run: mkdir -p out; sw_vers > out/versions.txt; xcodebuild -version >> out/versions.txt; xcrun simctl list --json > out/simulators.json
      - run: curl -fsSL https://github.com/yonaskolb/XcodeGen/releases/download/2.46.0/xcodegen.zip -o out/xcodegen.zip; unzip -q out/xcodegen.zip -d out/xcodegen; out/xcodegen/xcodegen/bin/xcodegen generate --spec ios2/project.yml
      - run: xcodebuild test -project ios2/UXBench.xcodeproj -scheme UXBench -destination 'platform=iOS Simulator,name=iPad Pro 13-inch (M4),OS=18.5' -resultBundlePath out/IOS.xcresult CODE_SIGNING_ALLOWED=NO 2>&1 | tee out/test.log
        timeout-minutes: 20
      - if: always()
        run: xcrun xcresulttool export attachments --path out/IOS.xcresult --output-path out/attachments
      - if: always()
        run: python3 ios2/collect.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios2-measure
          path: |
            out/app-runtime/
            out/versions.txt
            out/simulators.json
            out/test.log
            out/attachments/
            out/IOS.xcresult/
